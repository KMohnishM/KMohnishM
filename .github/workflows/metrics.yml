name: Metrics

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.svg'
      - 'metrics_renders/**'
  schedule:
  - cron: '30 4 * * 1'   # hourly refresh (GitHub scheduling isn't exact under load)
  workflow_dispatch:       # lets you trigger a manual refresh from the Actions tab

concurrency:
  group: metrics
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  streak-stats:
    runs-on: ubuntu-latest
    services:
      streak:
        image: jc21/github-readme-streak-stats:latest
        ports:
          - 8080:80
        env:
          TOKEN: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v4
      - name: Sync with remote before making changes
        run: git pull --rebase origin main
      - name: Wait for streak server to be ready
        run: |
          for i in $(seq 1 20); do
            if curl -sf "http://localhost:8080/?user=KMohnishM" -o /dev/null; then
              echo "Server is up"
              break
            fi
            sleep 3
          done
      - name: Fetch the real streak card
        run: |
          curl -sf "http://localhost:8080/?user=KMohnishM&theme=tokyonight&hide_border=true" -o github-streak.svg
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update streak svg"
          file_pattern: github-streak.svg

  readme-stats:
    needs: streak-stats
    runs-on: ubuntu-latest
    services:
      grs:
        image: ghcr.io/fim-sh/github-readme-stats-docker:latest
        ports:
          - 9000:9000
        env:
          PAT_1: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v4
      - name: Sync with remote before making changes
        run: git pull --rebase origin main
      - name: Wait for stats server to be ready
        run: |
          for i in $(seq 1 20); do
            if curl -sf "http://localhost:9000/api?username=KMohnishM" -o /dev/null; then
              echo "Server is up"
              break
            fi
            sleep 3
          done
      - name: Fetch the real stats + top-langs cards
        run: |
          curl -sf "http://localhost:9000/api?username=KMohnishM&show_icons=true&theme=tokyonight&hide_border=true&include_all_commits=true&count_private=true" -o github-readme-stats.svg
          curl -sf "http://localhost:9000/api/top-langs/?username=KMohnishM&layout=compact&theme=tokyonight&hide_border=true&langs_count=8" -o github-readme-langs.svg
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update readme stats svgs"
          file_pattern: github-readme-stats.svg github-readme-langs.svg

  metrics-activity:
    needs: readme-stats
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GH_PAT }}
          user: KMohnishM
          filename: github-metrics-activity.svg
          template: classic
          base: header
          plugin_activity: yes
          plugin_activity_limit: 10
